<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Звонки менеджеров по дням</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: page header → sticky filter bar with pill chips → summary card → grid of per-manager chart cards → daily table → method notes. Light only: tokens of the Centrika client cabinet. */
:root {
  --bg: #F4F6F9;
  --surface: #FFFFFF;
  --line: #E3E6EC;
  --ink: #111827;
  --ink-2: #374151;
  --muted: #6B7280;
  --head: #F9FAFB;
  --band: #F3F4F6;
  --grid: #EEF0F3;
  --axis: #D1D5DB;
  --blue: #2F5CE0;
  --blue-soft: #EEF2FF;
  --blue-line: #C7D2FE;
  --c-out: #2F5CE0;
  --c-in: #0E9F8E;
  --c-all: #9CA3AF;
  --font: "Inter", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 24px; padding-block: 28px 64px; display: grid; gap: 20px; }
h1 { font-size: 27px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
h2 { font-size: 17px; font-weight: 600; margin: 0; }
.lede { color: var(--ink-2); font-size: 16px; margin: 6px 0 0; max-width: 82ch; }
.note { color: var(--muted); font-size: 13px; margin: 4px 0 0; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; box-shadow: 0 6px 16px rgba(17, 24, 39, .04); }
.ctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ctl-name { color: var(--muted); font-size: 13px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 8px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--ink-2); font-weight: 500; font-size: 14px; line-height: 1.2; white-space: nowrap; }
.seg label:hover { background: var(--band); }
.seg input:checked + label { background: var(--blue-soft); border-color: var(--blue-line); color: var(--blue); }
.seg input:focus-visible + label { outline: 2px solid var(--blue); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-left: auto; color: var(--ink-2); font-size: 14px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.lk { width: 16px; height: 2px; border-radius: 1px; display: inline-block; }
.lk.out { background: var(--c-out); height: 3px; }
.lk.all { background: var(--c-all); }
.lk.in { background: var(--c-in); }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.sw.band { background: var(--band); outline: 1px solid var(--axis); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; overflow: hidden; }
.panel-head { padding: 16px 20px; border-bottom: 1px solid var(--line); }
.panel.pad { padding: 16px 20px; }
.head-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 10px 20px; }
.head-row > div:first-child { min-width: 0; }
td.na { color: var(--axis); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 11px 16px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; font-size: 14px; }
th { background: var(--head); font-weight: 500; color: var(--muted); border-top: 0; vertical-align: bottom; }
th:first-child, td:first-child { text-align: left; }
th .lk { margin-right: 7px; vertical-align: middle; }
tr.avg td { color: var(--ink-2); background: var(--head); font-weight: 500; }
td.total { font-weight: 600; }
td.src-col { color: var(--muted); }
td.mgr-cell { font-weight: 500; }
td.barcell { width: 28%; min-width: 150px; }
.hbar { display: flex; gap: 2px; height: 10px; }
.hbar i { display: block; height: 100%; }
.hbar i:last-child { border-radius: 0 4px 4px 0; }
.hbar .out { background: var(--c-out); }
.hbar .in { background: var(--c-in); }
.mgr-link { color: var(--ink); font-weight: 500; text-decoration: none; }
.mgr-link:hover { color: var(--blue); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; overflow: hidden; scroll-margin-top: 90px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.card-head > div { min-width: 0; }
.card h3 { font-size: 17px; font-weight: 600; margin: 0; }
.src { color: var(--muted); font-size: 13px; margin-top: 2px; }
.kpi { text-align: right; flex: none; }
.kpi b { display: block; font-size: 26px; font-weight: 700; line-height: 1.1; letter-spacing: -.01em; }
.kpi span { color: var(--muted); font-size: 12.5px; }
.split { color: var(--ink-2); font-size: 13.5px; padding: 12px 20px 0; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.split span { display: inline-flex; align-items: center; gap: 7px; }
.chart { position: relative; margin: 4px 14px 10px; }
.chart svg { display: block; width: 100%; overflow: visible; touch-action: pan-y; }
.chart text { font-family: var(--font); font-variant-numeric: tabular-nums; }
.hours { padding: 2px 16px 14px; border-top: 1px solid var(--line); container: hours / inline-size; }
.hours-title { font-size: 13px; color: var(--muted); margin: 10px 0 8px; }
.hours-title b { color: var(--ink); font-weight: 600; }
.htbl { table-layout: fixed; width: 100%; }
.htbl col.lbl { width: 92px; }
.htbl th, .htbl td { padding: 6px 2px; font-size: 12.5px; text-align: center; overflow: hidden; text-overflow: clip; }
.htbl th { padding-block: 7px; }
.htbl th:first-child, .htbl td:first-child { text-align: left; padding-left: 8px; }
.htbl .hs { display: none; }
@container hours (max-width: 460px) {
  .htbl col.lbl { width: 46px; }
  .htbl .hf { display: none; }
  .htbl .hs { display: inline; }
  .htbl th, .htbl td { font-size: 11.5px; padding-inline: 1px; }
  .htbl th:first-child, .htbl td:first-child { padding-left: 4px; }
}
.htbl td { color: var(--ink-2); }
.htbl td.z { color: var(--axis); }
.htbl tr.main td { color: var(--ink); font-weight: 600; }

details > summary { cursor: pointer; font-weight: 600; font-size: 17px; }
details > summary:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 4px; }
details[open] > summary { margin-bottom: 14px; }
.daily { border: 1px solid var(--line); border-radius: 12px; border-collapse: separate; border-spacing: 0; }
.daily th, .daily td { padding: 7px 9px; font-size: 13px; }
.daily td.lbl { color: var(--muted); }
.daily tr.sum td { font-weight: 600; }
.daily tr.last + tr td { border-top-color: var(--axis); }
.daily .off { background: var(--band); }

.rules { margin: 12px 0 0; padding-left: 20px; color: var(--ink-2); display: grid; gap: 6px; max-width: 100ch; }

.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(17, 24, 39, .10); border-radius: 12px; padding: 10px 14px; font-size: 13px; min-width: 200px; max-width: 290px; }
.tip-title { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
.tip-row { display: grid; grid-template-columns: 16px auto 1fr; align-items: baseline; column-gap: 7px; }
.tip-row + .tip-row { margin-top: 3px; }
.tip-row b { font-variant-numeric: tabular-nums; font-weight: 600; }
.tip-row span { color: var(--ink-2); }
.tip-row small { grid-column: 3; color: var(--muted); font-size: 11.5px; }
.tip-row .lk { align-self: center; }
.tip-row.main b { font-size: 15px; }
.tip-row.main span { color: var(--ink); font-weight: 500; }
.tip-flag { margin-top: 6px; color: var(--ink-2); font-size: 12px; }

@media (max-width: 700px) {
  .wrap { padding-inline: 16px; }
  h1 { font-size: 23px; }
  .legend { margin-left: 0; }
  .controls { position: static; }
  .kpi b { font-size: 22px; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Звонки менеджеров по дням</h1>
    <p class="lede" id="lede"></p>
    <p class="note" id="partial-note"></p>
  </header>

  <div class="controls" role="group" aria-label="Настройки графиков">
    <div class="ctl">
      <span class="ctl-name">Показатель</span>
      <div class="seg" id="metric"></div>
    </div>
    <div class="ctl">
      <span class="ctl-name">Шкала</span>
      <div class="seg" id="scale">
        <input type="radio" name="scale" id="scale-shared" value="shared" checked><label for="scale-shared">Общая</label>
        <input type="radio" name="scale" id="scale-own" value="own"><label for="scale-own">Своя у каждого</label>
      </div>
    </div>
    <div class="legend" aria-label="Обозначения">
      <span><i class="lk out"></i>Исходящие</span>
      <span><i class="lk in"></i>Входящие</span>
      <span><i class="lk all"></i>Вместе</span>
      <span><i class="sw band"></i>Исключённый день</span>
    </div>
  </div>

  <section class="panel">
    <div class="panel-head">
      <h2 id="sum-title"></h2>
      <p class="note">Офис и МТС сложены. Среднее за рабочий день, когда был хотя бы один звонок; исключённые дни не входят.</p>
    </div>
    <div class="tbl-wrap"><table id="summary"></table></div>
  </section>

  <section class="panel">
    <div class="panel-head head-row">
      <div>
        <h2 id="mon-title"></h2>
        <p class="note" id="mon-note"></p>
      </div>
      <div class="seg" id="mon-line">
        <input type="radio" name="mon-line" id="mon-out" value="out" checked><label for="mon-out">Исходящие</label>
        <input type="radio" name="mon-line" id="mon-in" value="in"><label for="mon-in">Входящие</label>
        <input type="radio" name="mon-line" id="mon-all" value="all"><label for="mon-all">Вместе</label>
      </div>
    </div>
    <div class="tbl-wrap"><table id="monthly"></table></div>
  </section>

  <section class="grid" id="cards"></section>

  <section class="panel pad">
    <details id="daily-details">
      <summary id="daily-title">Таблица по дням</summary>
      <div class="tbl-wrap"><table class="daily" id="daily"></table></div>
    </details>
  </section>

  <section class="panel pad">
    <h2>Как считали</h2>
    <ul class="rules" id="rules"></ul>
  </section>
</div>
<div class="tip" id="tip" hidden></div>

  const rules = [

const HOUR_TITLE = { calls: "Звонки по часам", gt10: "Звонки > 10 сек по часам", talk: "Разговор по часам, мин" };
function renderHours(mgr, mt) {
  const box = mgr._card.hours;
  const H = mgr.hourly, n = H.n || 1;
  const from = new Date(DATA.hours.from + "T00:00:00"), to = new Date(DATA.hours.to + "T00:00:00");

  title.append(el("b", {}, HOUR_TITLE[mt.id]),

  const t = el("table", { class: "htbl" });

  cg.append(el("col", { class: "lbl" }));
  for (const _ of DATA.hours.labels) cg.append(el("col"));
  t.append(cg);
  const both = (full, short) => {
    const f = document.createDocumentFragment();
    f.append(el("span", { class: "hf" }, full), el("span", { class: "hs" }, short));
    return f;
  };
  const hr = el("tr");
  hr.append(el("th", {}, "Час"));
  for (const h of DATA.hours.labels) {
    const th = el("th", { scope: "col", title: `с ${h}:00 до ${h}:59` });

  }

    const c0 = el("td");
    c0.append(both(L.label, { out: "Исх.", in: "Вход.", all: "Всего" }[L.id]));
    tr.append(c0);
    for (const r of H.rows) {
      const v = val(r, mt.id, "both", L.id) / n;
      const attrs = {};
      if (v < 0.05) attrs.class = "z";

        attrs.style = `background: color-mix(in srgb, var(--c-out) ${Math.round(6 + 30 * v * n / outMax)}%, var(--surface))`;
      tr.append(el("td", attrs, v < 0.05 ? "·" : fmt(v)));

  }
  t.append(tb);
  const wrap = el("div", { class: "tbl-wrap" });
  wrap.append(t);
  box.replaceChildren(title, wrap);
}

function niceStep(max, target = 4) {
  const raw = max / target;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const k of [1, 2, 2.5, 5, 10]) if (raw <= k * p) return k * p;
  return 10 * p;
}

function renderCharts() {
  const k = metric().id;
  const shared = Math.max(...DATA.managers.flatMap(m => m.days.map(d => val(d, k))), 1);
  for (const mgr of order) {
    const own = Math.max(...mgr.days.map(d => val(d, k)), 1);
    drawChart(mgr, state.scale === "shared" ? shared : own);
  }
}

function drawChart(mgr, yMaxRaw) {
  const mt = metric();
  const box = mgr._card.chart;
  const W = Math.max(box.clientWidth, 280);
  const H = 210;
  const pad = { l: 34, r: 10, t: 18, b: 24 };
  const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
  const step = niceStep(yMaxRaw);
  const yMax = Math.ceil(yMaxRaw / step) * step;
  const n = dates.length, slot = pw / n;
  const x = i => pad.l + (i + .5) * slot;
  const y = v => pad.t + ph - v / yMax * ph;
  const lastFull = partial[n - 1] ? n - 2 : n - 1;
  const a = averages(mgr, mt.id);

  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img",
    "aria-label": `${mgr.name}: ${mt.label.toLowerCase()} по дням. В среднем в день исходящих ${fmt(a.out)}, входящих ${fmt(a.in)}, вместе ${fmt(a.all)}` });

  for (const [s, e] of runsOf(mgr.days.map(d => d.vac))) {
    svg.append(sv("rect", { x: pad.l + s * slot, y: pad.t - 14, width: (e - s + 1) * slot, height: ph + 14, fill: "var(--band)" }));
    svg.append(sv("text", { x: pad.l + (s + e + 1) / 2 * slot, y: pad.t - 4, "text-anchor": "middle", "font-size": 10.5, fill: "var(--muted)" },
      e - s >= 2 ? "исключены" : "искл."));
  }

  for (let v = 0; v <= yMax + 1e-9; v += step) {
    svg.append(sv("line", { x1: pad.l, x2: pad.l + pw, y1: y(v), y2: y(v), stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1, "shape-rendering": "crispEdges" }));
    svg.append(sv("text", { x: pad.l - 6, y: y(v) + 3.5, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" }, fmt(v, 1)));
  }
  dates.forEach((d, i) => {
    if (i === 0 || d.getDay() === 1)
      svg.append(sv("text", { x: x(i), y: H - 6, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" }, dm(d)));
  });

  const series = LINES.map(L => ({ ...L, v: mgr.days.map(d => val(d, mt.id, "both", L.id)) }));
  const mainPts = series[0].v.slice(0, lastFull + 1).map((v, i) => `${x(i)},${y(v)}`);
  svg.append(sv("path", { d: `M${x(0)},${y(0)}L${mainPts.join("L")}L${x(lastFull)},${y(0)}Z`, fill: "var(--c-out)", "fill-opacity": .08 }));

  for (const s of series.slice().reverse()) {
    const pts = s.v.map((v, i) => `${x(i)},${y(v)}`);
    const common = { fill: "none", stroke: `var(--c-${s.id})`, "stroke-width": s.width, "stroke-linejoin": "round", "stroke-linecap": "round" };
    svg.append(sv("path", { d: "M" + pts.slice(0, lastFull + 1).join("L"), ...common }));
    if (lastFull < n - 1)
      svg.append(sv("path", { d: "M" + pts.slice(lastFull).join("L"), ...common, "stroke-dasharray": "3 4", "stroke-opacity": .7 }));
  }

  const cross = sv("line", { y1: pad.t, y2: pad.t + ph, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" });
  svg.append(cross);
  const dots = series.map(s => {
    const c = sv("circle", { r: 4.5, fill: `var(--c-${s.id})`, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" });
    svg.append(c);
    return c;
  });

  const hit = sv("rect", { x: pad.l, y: 0, width: pw, height: H, fill: "transparent" });
  const move = e => {
    const r = svg.getBoundingClientRect();
    const i = Math.min(n - 1, Math.max(0, Math.floor((e.clientX - r.left - pad.l) / slot)));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i));
    cross.setAttribute("visibility", "visible");
    series.forEach((s, j) => {
      dots[j].setAttribute("cx", x(i)); dots[j].setAttribute("cy", y(s.v[i]));
      dots[j].setAttribute("visibility", "visible");
    });
    showTip(mgr, mt, i, e.clientX, e.clientY);
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => {
    cross.setAttribute("visibility", "hidden");
    dots.forEach(c => c.setAttribute("visibility", "hidden"));
    hideTip();
  });
  svg.append(hit);
  box.replaceChildren(svg);
}

// ── tooltip ──────────────────────────────────────────────
const tip = document.getElementById("tip");
function showTip(mgr, mt, i, cx, cy) {
  const d = mgr.days[i], dt = dates[i], k = mt.id;
  tip.replaceChildren(el("div", { class: "tip-title" }, `${WD[dt.getDay()]}, ${dm(dt)}.${dt.getFullYear()} · ${mt.label.toLowerCase()}`));
  for (const L of LINES) {
    const r = el("div", { class: L.id === "out" ? "tip-row main" : "tip-row" });
    r.append(el("i", { class: "lk " + L.id }), el("b", {}, fmt(val(d, k, "both", L.id), mt.digits)), el("span", {}, L.label.toLowerCase()));
    const parts = [];
    if (mgr.office) {
      let p = "офис " + fmt(val(d, k, "o", L.id), mt.digits);
      if (k === "calls" && L.id === "in" && d.o_missed) p += ` (пропущ. ${d.o_missed})`;
      parts.push(p);
    }
    if (mgr.mts) parts.push("МТС " + fmt(val(d, k, "m", L.id), mt.digits));
    if (parts.length > 1) r.append(el("small", {}, parts.join(" · ")));
    tip.append(r);
  }
  if (d.vac) tip.append(el("div", { class: "tip-flag" }, "Исключённый день: в среднее не входит"));
  if (partial[i]) tip.append(el("div", { class: "tip-flag" }, "Неполный день: " + partial[i]));
  if (noMts[i] && mgr.mts) tip.append(el("div", { class: "tip-flag" }, "МТС за этот день данных пока нет"));
  if (!val(d, "calls") && !d.vac) tip.append(el("div", { class: "tip-flag" }, "Звонков нет"));
  tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let tx = cx + 14, ty = cy - h - 12;
  if (tx + w > window.innerWidth - 8) tx = cx - w - 14;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = cy + 16;
  tip.style.left = tx + "px";
  tip.style.top = ty + "px";
}
function hideTip() { tip.hidden = true; }
window.addEventListener("scroll", hideTip, { passive: true });
